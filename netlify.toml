[build]
  command = "npm install --no-audit --no-fund && cd backend && npm ci && cd ../frontend && npm ci && npm run build && cp -r dist ../dist"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.10.0"

# Proxy API calls to the Express Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true

# Support React Router routes on direct navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
