[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# Proxy API requests to your backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Handle client-side routing - must be last rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom 404 page (optional - create a 404.html in frontend/dist)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
